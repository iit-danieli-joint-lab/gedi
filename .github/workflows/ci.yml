name: GeDi Release Workflow

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  release:
    types: [published]

jobs:
  wheel-build:
    # start only when: 
    # - label wheel-build is added to a PR
    # - or a Release is published
    if: github.event.label.name == 'wheel-build' || github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
        pixi-env: [
          py39-cpu, py39-cu118, py39-cu121, py39-cu124, py39-cu126, py39-cu128, py39-cu129,
          py310-cpu, py310-cu118, py310-cu121, py310-cu124, py310-cu126, py310-cu128, py310-cu129,
          py311-cpu, py311-cu118, py311-cu121, py311-cu124, py311-cu126, py311-cu128, py311-cu129,
          py312-cpu, py312-cu118, py312-cu121, py312-cu124, py312-cu126, py312-cu128, py312-cu129
        ]

    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        run: env

      - uses: prefix-dev/setup-pixi@v0.8.3

      - name: Select Pixi environment
        run: echo "PIX_ENV=${{ matrix.pixi-env }}" >> $GITHUB_ENV
        shell: bash

      - name: Build wheel
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            pixi run -e $PIX_ENV wheel-build-linux
          else
            pixi run -e $PIX_ENV wheel-build-windows
          fi
        shell: bash

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.pixi-env }}
          path: Release/*.whl

  publish:
    # start only when: 
    # - label wheel-build is added to a PR
    # - or a Release is published
    needs: wheel-build
    if: github.event.label.name == 'wheel-build' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          path: gh-pages

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Organize wheels and generate index
        run: |
          mkdir -p gh-pages/simple/idjl-gedi/{cpu,cu118,cu121,cu124,cu126,cu128,cu129}
          
          # Organize wheels into subfolders based on their tags
          for artifact_dir in downloaded-artifacts/*; do
            if [[ -d "$artifact_dir" ]]; then
              for whl in "$artifact_dir"/*.whl; do
                if [[ "$whl" == *"+cpu"* ]]; then
                  cp "$whl" gh-pages/simple/idjl-gedi/cpu/
                elif [[ "$whl" == *"+cu118"* ]]; then
                  cp "$whl" gh-pages/simple/idjl-gedi/cu118/
                elif [[ "$whl" == *"+cu121"* ]]; then
                  cp "$whl" gh-pages/simple/idjl-gedi/cu121/
                elif [[ "$whl" == *"+cu124"* ]]; then
                  cp "$whl" gh-pages/simple/idjl-gedi/cu124/
                elif [[ "$whl" == *"+cu126"* ]]; then
                  cp "$whl" gh-pages/simple/idjl-gedi/cu126/
                elif [[ "$whl" == *"+cu128"* ]]; then
                  cp "$whl" gh-pages/simple/idjl-gedi/cu128/
                elif [[ "$whl" == *"+cu129"* ]]; then
                  cp "$whl" gh-pages/simple/idjl-gedi/cu129/
                else
                  cp "$whl" gh-pages/simple/idjl-gedi/cpu/  # Fallback
                fi
              done
            fi
          done
          
          # Generate index.html for each subfolder and the main folder
          python3 -c "
          import os
          def gen_index(path, include_subdirs=False):
              files = [f for f in os.listdir(path) if f.endswith('.whl')]
              if include_subdirs:
                  subdirs = [d for d in os.listdir(path) if os.path.isdir(os.path.join(path, d)) and d not in ['.', '..']]
                  for sub in subdirs:
                      sub_files = [os.path.join(sub, f) for f in os.listdir(os.path.join(path, sub)) if f.endswith('.whl')]
                      files.extend(sub_files)
              with open(os.path.join(path, 'index.html'), 'w') as f:
                  f.write('<!DOCTYPE html><html><body>\\n')
                  for file in sorted(files):
                      f.write(f'<a href=\"{file}\">{file}</a><br>\\n')
                  f.write('</body></html>\\n')
          
          base_path = 'gh-pages/simple/idjl-gedi'
          for sub in ['cpu', 'cu118', 'cu121', 'cu124', 'cu126', 'cu128', 'cu129']:
              if os.path.exists(os.path.join(base_path, sub)):
                  gen_index(os.path.join(base_path, sub))
          gen_index(base_path, include_subdirs=True)
          "

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update wheels"
          git push origin gh-pages
