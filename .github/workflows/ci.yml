name: GeDi Release Workflow

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  release:
    types: [published]

jobs:
  wheel-build:
    # start only when: 
    # - label wheel-build is added to a PR
    # - or a Release is published
    if: github.event.label.name == 'wheel-build' || github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
        pixi-env: [
          py39-cpu, py39-cu118, py39-cu121, py39-cu124, py39-cu126, py39-cu128, py39-cu129,
          py310-cpu, py310-cu118, py310-cu121, py310-cu124, py310-cu126, py310-cu128, py310-cu129,
          py311-cpu, py311-cu118, py311-cu121, py311-cu124, py311-cu126, py311-cu128, py311-cu129,
          py312-cpu, py312-cu118, py312-cu121, py312-cu124, py312-cu126, py312-cu128, py312-cu129
        ]

    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        run: env

      - uses: prefix-dev/setup-pixi@v0.8.3

      - name: Select Pixi environment
        run: echo "PIX_ENV=${{ matrix.pixi-env }}" >> $GITHUB_ENV
        shell: bash

      - name: Build wheel
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            pixi run -e $PIX_ENV wheel-build-linux
          else
            pixi run -e $PIX_ENV wheel-build-windows
          fi
        shell: bash

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.pixi-env }}
          path: Release/*.whl

  publish:
    # start only when: 
    # - A Release is published  
    needs: wheel-build
    if: github.event.label.name == 'wheel-build' || github.event_name == 'release'
    runs-on: ubuntu-22.04

    steps:
      # Download all artifacts produced by the wheel-build matrix
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: Release

      # Configure Git for deployment
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Generate/Update wheel index using external script
      - name: Generate/Update wheel index
        run: |
          python - <<'EOF'
          import os
          import shutil

          base_dir = "whl-index"
          subdirs = ["cpu", "cu118","cu121","cu124","cu126","cu128","cu129"]

          os.makedirs(base_dir, exist_ok=True)
          index_main = os.path.join(base_dir, "index.html")
          if not os.path.exists(index_main):
              with open(index_main, "w") as f:
                  f.write("<html><body>\n</body></html>")

          for d in subdirs:
              subdir_path = os.path.join(base_dir, d)
              os.makedirs(subdir_path, exist_ok=True)
              index_file = os.path.join(subdir_path, "index.html")
              if not os.path.exists(index_file):
                  with open(index_file, "w") as f:
                      f.write("<html><body>\n</body></html>")

          def update_index(wheel_path):
              whl_name = os.path.basename(wheel_path)
              if "+cpu" in whl_name:
                  subdir = os.path.join(base_dir, "cpu")
              elif "+cu" in whl_name:
                  cu_ver = whl_name.split("+cu")[1].split("_")[0]
                  subdir = os.path.join(base_dir, f"cu{cu_ver}")
              else:
                  subdir = base_dir

              os.makedirs(subdir, exist_ok=True)
              dest_path = os.path.join(subdir, whl_name)
              if not os.path.exists(dest_path):
                  shutil.copy2(wheel_path, dest_path)

              index_file = os.path.join(subdir, "index.html")
              with open(index_file, "r") as f:
                  content = f.read()
              if whl_name not in content:
                  content = content.replace("</body></html>", f'<a href="{whl_name}">{whl_name}</a><br>\n</body></html>')
                  with open(index_file, "w") as f:
                      f.write(content)

          for whl in os.listdir("Release"):
              if whl.endswith(".whl"):
                  update_index(os.path.join("Release", whl))
          EOF

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./whl-index
          publish_branch: gh-pages

